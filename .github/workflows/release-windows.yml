name: Release Windows
on:
  push:
    tags: ['windows-v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Check version and prepare release notes
        shell: pwsh
        run: |
          $version = (Get-Content windows/VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "windows-v$version") { throw 'Tag and VERSION differ' }
          $log = Get-Content windows/CHANGELOG.md -Raw
          $heading = '(?ms)^## ' + [regex]::Escape($version) + '\b[^\r\n]*\r?\n(.*?)(?=^## |\z)'
          $match = [regex]::Match($log, $heading)
          if (!$match.Success) { throw 'Missing changelog section' }
          $match.Groups[1].Value.Trim() | Set-Content release-notes.md -Encoding utf8NoBOM
      - run: windows/script/build.ps1 -Action Test
      - run: windows/script/build.ps1 -Action Package
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content windows/VERSION -Raw).Trim()
          gh release create $env:GITHUB_REF_NAME "dist.noindex/windows/releases/Perch-Windows-$version-x64.zip" dist.noindex/windows/releases/SHA256SUMS --title "Perch Windows $version" --notes-file release-notes.md --prerelease --verify-tag
